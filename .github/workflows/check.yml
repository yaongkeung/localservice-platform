name: Check MVP
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm ci
      - run: npm run check
      - run: npm test
      - run: npm run build:check
        env:
          WRANGLER_SEND_METRICS: "false"
      - run: npm run test:runtime
        env:
          WRANGLER_SEND_METRICS: "false"
